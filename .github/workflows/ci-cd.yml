name: CI/CD — Portfolio Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Job 1: Lint & Build Validation ───────────────────────────────────────
  validate:
    name: Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build

  # ── Job 2: Deploy to AWS EC2 (only on push to main) ──────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "▶ Pulling latest code..."
            cd ~/titisportofolio
            git pull origin main

            echo "▶ Stopping old container..."
            docker stop titisportofolio || true
            docker rm titisportofolio || true

            echo "▶ Building new Docker image..."
            docker build -t titisportofolio .

            echo "▶ Starting new container..."
            docker run -d -p 3000:3000 --name titisportofolio --restart unless-stopped titisportofolio

            echo "✅ Deployment complete!"
